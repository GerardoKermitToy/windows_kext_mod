[package]
name = "driver"
version = "0.0.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "driver"
path = "src/lib.rs"
crate-type = ["staticlib"]

[features]
udp-lifecycle-diagnostics = []
perf-etw = ["wdk/perf-etw"]

[dependencies]
wdk = { path = "../wdk" }
protocol = { path = "../protocol" }
hashbrown = { version = "=0.17.1", default-features = false, features = ["inline-more"] }
rustc-hash = { version = "=2.1.3", default-features = false }
likely_stable = { version = "0.1.3", default-features = false }
num-derive = { version = "0.5.1", default-features = false }
num-traits = { version = "0.2.19", default-features = false }
# smoltcp 0.14 requires a medium and socket when IPv6 support is enabled.
smoltcp = { version = "0.14.0", default-features = false, features = ["medium-ip", "proto-ipv4", "proto-ipv6", "socket-raw"] }

# Keep this in sync with wdk; changes require a kernel ABI review.
[dependencies.windows-sys]
version = "=0.61.2"
features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Wdk_System_SystemServices", "Wdk_System_Registry", "Win32_System_Registry", "Win32_Foundation", "Win32_Security", "Win32_System_IO", "Win32_System_Kernel", "Win32_System_Power", "Win32_System_WindowsProgramming", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_NetworkManagement_WindowsFilteringPlatform"]

# Resolve windows-sys symbols through WDK import libraries, not user-mode DLLs.
[patch.crates-io]
windows-link = { path = "../kernel-windows-link" }

[profile.release]
debug = 2
lto = "fat"
