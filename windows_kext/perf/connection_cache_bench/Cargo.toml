[package]
name = "connection-cache-bench"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
hashbrown = { version = "=0.17.1", default-features = false, features = ["inline-more"] }
rustc-hash = { version = "=2.1.3", default-features = false }
siphasher = { version = "=1.0.4", default-features = false }
likely_stable = { version = "0.1.3", default-features = false }
num-derive = { version = "0.5.1", default-features = false }
num-traits = { version = "0.2.19", default-features = false }
# Match the driver's minimal smoltcp 0.14 feature set.
smoltcp = { version = "0.14.0", default-features = false, features = ["medium-ip", "proto-ipv4", "proto-ipv6", "socket-raw"] }

[profile.release]
debug = 1
opt-level = 3
codegen-units = 1
lto = "fat"

[workspace]
