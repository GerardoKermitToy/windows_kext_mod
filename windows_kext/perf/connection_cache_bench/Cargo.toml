[package]
name = "connection-cache-bench"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
hashbrown = { version = "=0.15.5", default-features = false, features = ["inline-more"] }
rustc-hash = { version = "=2.1.1", default-features = false }
siphasher = { version = "=1.0.1", default-features = false }
likely_stable = { version = "0.1.3", default-features = false }
num-derive = { version = "0.4", default-features = false }
num-traits = { version = "0.2", default-features = false }
smoltcp = { version = "0.10", default-features = false, features = ["proto-ipv4", "proto-ipv6"] }

[profile.release]
debug = 1
opt-level = 3
codegen-units = 1
lto = "fat"

[workspace]
